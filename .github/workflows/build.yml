name: 
Build TM Pizzaria APK. On: workflow dispatch. Push: branches, main. Jobs. Build. Runs-on: ubuntu-latest. Steps: uses: actions/checkout@v4 uses: actions/setup-java@v4 with: distribution: temurin, java-version: '17'. uses: gradle/actions/setup-gradle@v4, com gradle-version: '8.9'. E, em seguida, use o comando run: ./gradlew assembleDebug. Por fim, mantenha o upload do APK igual. Depois de copiar, me avise se o texto entrou certinho.