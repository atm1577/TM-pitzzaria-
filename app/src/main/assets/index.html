<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#b91c1c"><title>TM Pizzaria Delivery</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8f0;color:#29211c}header{background:linear-gradient(135deg,#991b1b,#ea580c);color:white;padding:24px 18px 20px;border-radius:0 0 24px 24px}header h1{margin:0;font-size:28px}header p{margin:8px 0 0}.wrap{max-width:650px;margin:auto;padding:16px}.section{margin:18px 0}.section h2{margin:0 0 12px}.pizza{background:white;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;margin:10px 0;box-shadow:0 2px 10px #0000000b}.pizza .emoji{width:82px;height:82px;border-radius:12px;background:#ffedd5;display:grid;place-items:center;font-size:48px;flex-shrink:0}.pizza h3{margin:0 0 5px}.pizza p{margin:0 0 8px;font-size:13px;color:#6b625c}.price{font-weight:bold;color:#b91c1c}.pizza button, .checkout{border:0;background:#b91c1c;color:white;border-radius:10px;padding:10px 14px;font-weight:bold}.pizza button{margin-left:auto}.cart{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 10px #00000010}.cartline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.cartline button{background:#fee2e2;border:0;border-radius:7px;padding:4px 8px}.fields input,.fields textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font:inherit}.checkout{width:100%;font-size:16px;padding:14px;margin-top:12px;background:#15803d}.small{font-size:12px;color:#777}.empty{color:#777}.badge{font-size:12px;background:#ffedd5;padding:5px 8px;border-radius:99px;display:inline-block;margin-top:10px}
</style></head><body><header><h1>🍕 TM Pizzaria Delivery</h1><p>Sua pizza quentinha na porta, a um clique de distância!</p><span class="badge">Pizzas de 35 cm</span></header><main class="wrap"><section class="section"><h2>🍕 Nosso cardápio</h2><div id="menu"></div></section><section class="section cart"><h2>🛒 Seu pedido</h2><div id="cart"><p class="empty">Seu carrinho está vazio.</p></div><div class="fields"><input id="customer" placeholder="Seu nome"><input id="address" placeholder="Endereço para entrega"><input id="phone" inputmode="numeric" placeholder="WhatsApp da pizzaria (DDD + número)" value=""><textarea id="note" placeholder="Observações (opcional)" rows="2"></textarea></div><h3 id="total">Total: R$ 0,00</h3><button class="checkout" onclick="sendOrder()">Enviar pedido pelo WhatsApp</button><p class="small">Versão de teste: preencha o número da pizzaria no campo WhatsApp.</p></section></main><script>
const pizzas=[{name:'Calabresa',desc:'Muçarela, calabresa, cebola e orégano.',price:90},{name:'Moda da Casa',desc:'Presunto, muçarela, ovo, palmito, cebola e orégano.',price:100},{name:'Quatro Queijos',desc:'Muçarela, parmesão, provolone e gorgonzola.',price:95},{name:'Mussarela',desc:'Muçarela, molho de tomate e orégano.',price:85},{name:'Frango',desc:'Frango desfiado, muçarela e orégano.',price:85},{name:'Frango com Catupiry',desc:'Frango desfiado, catupiry e muçarela.',price:85},{name:'Presunto',desc:'Presunto, muçarela, tomate e orégano.',price:85},{name:'Portuguesa',desc:'Presunto, ovo, cebola, muçarela e orégano.',price:85}];let cart={};const fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function renderMenu(){document.getElementById('menu').innerHTML=pizzas.map((p,i)=>`<article class="pizza"><div class="emoji">🍕</div><div><h3>${p.name}</h3><p>${p.desc}</p><span class="price">${fmt(p.price)}</span></div><button onclick="add(${i})">Adicionar</button></article>`).join('')}
function add(i){cart[i]=(cart[i]||0)+1;renderCart()}function remove(i){cart[i]--;if(cart[i]<=0)delete cart[i];renderCart()}
function renderCart(){let entries=Object.entries(cart);if(!entries.length){document.getElementById('cart').innerHTML='<p class="empty">Seu carrinho está vazio.</p>';document.getElementById('total').textContent='Total: R$ 0,00';return}let total=0;document.getElementById('cart').innerHTML=entries.map(([i,q])=>{let p=pizzas[i];total+=p.price*q;return `<div class="cartline"><div><b>${q}x ${p.name}</b><br><span class="small">${fmt(p.price*q)}</span></div><button onclick="remove(${i})">−</button></div>`}).join('');document.getElementById('total').textContent='Total: '+fmt(total)}
function sendOrder(){let entries=Object.entries(cart);if(!entries.length){alert('Adicione uma pizza ao carrinho.');return}let customer=document.getElementById('customer').value.trim(),address=document.getElementById('address').value.trim(),phone=document.getElementById('phone').value.replace(/\D/g,''),note=document.getElementById('note').value.trim();if(!customer||!address){alert('Preencha seu nome e endereço.');return}if(phone.length<10){alert('Digite o WhatsApp da pizzaria com DDD.');return}let total=0,lines=entries.map(([i,q])=>{let p=pizzas[i];total+=p.price*q;return `${q} x ${p.name} — ${fmt(p.price*q)}`});let msg=`🍕 *PEDIDO TM PIZZARIA*\n\nCliente: ${customer}\nEndereço: ${address}\n\n${lines.join('\n')}\n\n*Total: ${fmt(total)}*${note?'\nObservações: '+note:''}`;window.open('https://wa.me/55'+phone+'?text='+encodeURIComponent(msg),'_blank')}
renderMenu();renderCart();</script></body></html>
